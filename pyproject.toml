[tool.uv.workspace]
members = ["lethe", "research"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "lethe", "lethe-research"]

[tool.uv.sources]
lethe = { workspace = true }
lethe-research = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["lethe", "research"]

[tool.pytest.ini_options]
testpaths = ["lethe/tests", "research/tests"]
addopts = "--import-mode=importlib -q -p lethe -p research"
